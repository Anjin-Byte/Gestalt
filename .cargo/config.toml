# `cargo xtask <task>` → runs the build-automation binary in tools/xtask.
[alias]
xtask = "run --quiet --package xtask --"

# getrandom 0.3 (tobj → ahash, in the web build) refuses to guess an entropy
# source on bare wasm32-unknown-unknown; this cfg + the `wasm_js` feature
# (enabled in voxelizer's wasm32 deps) select the browser-crypto backend, per
# https://docs.rs/getrandom/0.3/#webassembly-support. Native targets unaffected.
[target.wasm32-unknown-unknown]
rustflags = ['--cfg', 'getrandom_backend="wasm_js"']
