name: Deploy to GitHub Pages

# Builds the web shell entirely from source — the wasm kernel, the compressed
# demo set (rebuilt from the committed .glb via gltf-transform + sharp), and the
# Vite bundle — then publishes web/dist to GitHub Pages.
#
# Requires: repo Settings → Pages → Source = "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One rollout at a time; don't cancel a deploy already in flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build web shell
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Rust + the wasm32 target (both pinned by rust-toolchain.toml); the build
      # inherits the getrandom-wasm rustflags from .cargo/config.toml.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build the wasm kernel (release)
        run: wasm-pack build crates/voxel-web --release --target web

      # Rebuild the compressed demo set from the committed sources: texture
      # resize/re-encode + prune + gzip → web/src/assets/demos/*.glb.gz.
      - name: Pack demos
        run: make demos

      - name: Install shell deps
        run: npm ci
        working-directory: web

      # tsc gate + Vite build. vite.config bases the output at /Gestalt/
      # for `command === "build"`, so every hashed asset resolves under Pages.
      - name: Build the shell
        run: npm run build
        working-directory: web

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
