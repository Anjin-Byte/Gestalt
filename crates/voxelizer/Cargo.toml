[package]
name = "voxelizer"
description = "Surface (conservative) mesh voxelizer: a wgpu compute path diffed against a CPU SAT reference oracle, emitting voxel-core occupancy for the renderer."
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
# Application workspace, not a published library — never goes to crates.io. Also
# lets the supply-chain gate (`cargo xtask ci-deps`) accept the internal path deps.
publish = false

[features]
# Default-on so plain `cargo test`/`clippy` exercise both input adapters, but
# the heavy parsing dependencies are droppable via `--no-default-features` (the
# `loader` module gates out entirely). Each format gates its own optional dep,
# so `--features obj` (no glTF) and vice versa both compile independently.
default = ["gltf", "obj", "stl", "vox", "cvox"]
gltf = ["dep:gltf"]
obj = ["dep:tobj", "dep:image"]
stl = ["dep:stl_io"]
# MagicaVoxel .vox: unlike the mesh formats this is voxel-native IO — import
# maps straight to `SparseTree::from_voxels` (no voxelization pass), and it is
# the first implemented output adapter (io/export).
vox = ["dep:dot_vox"]
# Compressed voxel .cvox (github.com/JelleBouma/cvox): .vox's compressed
# sibling — unlimited colours, >256³ via multi-model translations. Hand-rolled
# adapters, no dependency.
cvox = []

# The example loads a textured mesh via `load_mesh`/`rotation_degrees`, which are
# gated behind the loader features. Without this, `--no-default-features
# --all-targets` fails to compile the example (the symbols are cfg'd out); the
# `required-features` makes Cargo skip it when no glTF loader is present.
[[example]]
name = "material_leaf_histogram"
required-features = ["gltf"]

[dependencies]
voxel-core = { workspace = true }
bytemuck = { workspace = true }
glam = { workspace = true }
wgpu = { workspace = true }
thiserror = { workspace = true }
pollster = { workspace = true }
gltf = { workspace = true, optional = true }
tobj = { workspace = true, optional = true }
image = { workspace = true, optional = true }
stl_io = { workspace = true, optional = true }
# Oneshot future for the GPU readback helpers (gpu/buffers.rs): the map result
# must be awaitable so the same code runs natively (pollster) and on wasm32
# (browser-driven).
futures-channel = { workspace = true }
# MagicaVoxel .vox parser and writer (io/import/vox.rs, io/export/vox.rs).
# Crate-local: single consumer.
dot_vox = { version = "5.2", optional = true }

# Browser console logging for the wasm32 debug path (csr.rs). Native/macOS builds
# do not pull this in.
[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["console"] }
# Not used directly: opts the transitive tobj→ahash→getrandom edge into the
# browser-crypto backend (pairs with the cfg in .cargo/config.toml).
getrandom = { version = "0.3", features = ["wasm_js"] }

[dev-dependencies]
proptest = { workspace = true }
glam = { workspace = true }   # construct test meshes (Vec3) in integration tests

[lints]
workspace = true
